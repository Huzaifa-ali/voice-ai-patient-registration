[project]
name = "voice-patient-agent"
version = "1.0.0"
description = "Voice AI patient-registration agent — FastAPI + SQLite backend, REST API, and Vapi voice webhook."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy==2.0.41",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    "python-dotenv==1.1.0",
    "jinja2==3.1.4",
    "psycopg[binary]==3.2.3",
]

[dependency-groups]
dev = [
    "ruff==0.11.12",
    "mypy==1.16.0",
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py"]
exclude = [".venv", "scripts/"]

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes; I = isort (imports ordered, at top).
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "scripts/",
    "tests/",
    "\\.venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
